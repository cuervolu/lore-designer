[versions]
kotlin = "2.4.0"
compose-multiplatform = "1.12.0"
kermit = "2.1.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
koin = "4.2.2"
multiplatformSettings = "1.3.0"
room = "2.8.4"
ksp = "2.3.9"
spotless = "8.8.0"
nucleus = "2.5.16"
compose-icons = "2.2.1"
composeunstyled = "2.7.0"
filekit = "0.14.2"
sqlite = "2.6.2"
stability = "0.10.0"
interaction = "1.1.0"
androidx-nav3 = "1.1.1"
androidx-viewmodel = "2.10.0"
junit = "6.1.3"
kotlinx-datetime = "0.8.0"
[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-viewmodel" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-viewmodel" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
compose-nav3 = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-nav3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
multiplatformSettings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
multiplatformSettings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }



# Nucleus
nucleus-core-runtime = { module = "dev.nucleusframework:nucleus.core-runtime", version.ref = "nucleus" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
nucleus-updater-runtime = { module = "dev.nucleusframework:nucleus.updater-runtime", version.ref = "nucleus" }
nucleus-taskbar-progress-tao = { module = "dev.nucleusframework:nucleus.taskbar-progress-tao", version.ref = "nucleus" }
nucleus-decorated-window-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-darkmode-detector = { module = "dev.nucleusframework:nucleus.darkmode-detector", version.ref = "nucleus" }
nucleus-system-info = {module = "dev.nucleusframework:nucleus.system-info", version.ref = "nucleus"}


filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }


# Compose Unstyled
compose-unstyled-button = { module = "com.composables:composeunstyled-button", version.ref = "composeunstyled" }
composeunstyled-text-field = { module = "com.composables:composeunstyled-text-field", version.ref = "composeunstyled" }
composeunstyled-dialog = { module = "com.composables:composeunstyled-dialog", version.ref = "composeunstyled" }
composeunstyled-dropdown-menu = { module = "com.composables:composeunstyled-dropdown-menu", version.ref = "composeunstyled" }
composeunstyled-modal = { module = "com.composables:composeunstyled-modal", version.ref = "composeunstyled" }
composeunstyled-progress = { module = "com.composables:composeunstyled-progress", version.ref = "composeunstyled" }
composeunstyled-tab-group = { module = "com.composables:composeunstyled-tab-group", version.ref = "composeunstyled" }
composeunstyled-tooltip = { module = "com.composables:composeunstyled-tooltip", version.ref = "composeunstyled" }
compose-icons-lucide = { module = "com.composables:icons-lucide-cmp", version.ref = "compose-icons" }
compose-unstyled-platformtheme = { module = "com.composables:composeunstyled-platformtheme", version.ref = "composeunstyled" }
compose-unstyled-theming = { module = "com.composables:composeunstyled-theming", version.ref = "composeunstyled" }
compose-unstyled-colored-indication = { module = "com.composables:composeunstyled-colored-indication", version.ref = "composeunstyled" }
compose-interaction-capabilities = { module = "com.composables:compose-interaction-capabilities", version.ref = "interaction" }

[bundles]
compose-unstyled = [
    "compose-unstyled-theming",
    "compose-unstyled-colored-indication",
    "compose-unstyled-button",
    "composeunstyled-text-field",
    "compose-unstyled-platformtheme",
    "composeunstyled-dialog",
    "composeunstyled-dropdown-menu",
    "composeunstyled-modal",
    "composeunstyled-progress",
    "composeunstyled-tab-group",
    "composeunstyled-tooltip",
    "compose-interaction-capabilities",
    "compose-icons-lucide"
]
nucleus = [
    "nucleus-core-runtime",
    "nucleus-updater-runtime",
    "nucleus-application",
    "nucleus-taskbar-progress-tao",
    "nucleus-darkmode-detector",
    "nucleus-decorated-window-tao",
    "nucleus-system-info"
]

filekit = [
    "filekit-core",
    "filekit-dialogs"
]




[plugins]

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "stability" }
nucleus = { id = "dev.nucleusframework", version.ref = "nucleus" }
